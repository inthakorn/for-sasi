<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sasi 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000; /* พื้นหลังสีดำสนิท */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Tahoma', 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // สมการสร้างรูปหัวใจ
    function heartEquation(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x, y };
    }

    // ข้อความสลับกัน
    const textList = ["ศศิ", "รักเธอ"];
    const heartParticles = [];
    const totalHeartPoints = 200; // จำนวนข้อความเรียงตัวบนรูปหัวใจ

    for (let i = 0; i < totalHeartPoints; i++) {
        const t = (Math.PI * 2 / totalHeartPoints) * i - Math.PI / 2;
        const pos = heartEquation(t);
        
        heartParticles.push({
            baseX: pos.x,
            baseY: pos.y,
            text: textList[i % textList.length], // สลับคำว่า ศศิ กับ รักเธอ
            size: Math.random() * 3 + 12,
            alpha: 0
        });
    }

    // สร้างละอองวิ้งๆ เรืองแสงรอบๆ
    const sparkleCount = 60;
    const sparkles = [];
    for (let i = 0; i < sparkleCount; i++) {
        const t = Math.random() * Math.PI * 2;
        const pos = heartEquation(t);
        sparkles.push({
            baseX: pos.x + (Math.random() - 0.5) * 6,
            baseY: pos.y + (Math.random() - 0.5) * 6,
            text: textList[i % textList.length],
            size: Math.random() * 6 + 8,
            alpha: Math.random(),
            speed: Math.random() * 0.03 + 0.01
        });
    }

    let progress = 0;
    let pulse = 0;

    function draw() {
        // เงาจางๆ หลังการวาด
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const scale = Math.min(canvas.width, canvas.height) / 42;

        pulse += 0.04;
        const pulseFactor = 1 + Math.sin(pulse) * 0.03; // หัวใจเต้นเบาๆ

        // ค่อยๆ ปรากฏขึ้นทีละตัวตามลำดับ
        if (progress < totalHeartPoints) {
            progress += 0.8;
        }

        // 1. วาดละอองเรืองแสง (Sparkles)
        sparkles.forEach(s => {
            s.alpha += s.speed;
            if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;

            const x = centerX + s.baseX * scale * pulseFactor;
            const y = centerY + s.baseY * scale * pulseFactor;

            ctx.font = `${s.size}px Tahoma, sans-serif`;
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ff2a8d';
            ctx.fillStyle = `rgba(255, 105, 180, ${Math.max(0, s.alpha * 0.7)})`;
            ctx.fillText(s.text, x, y);
        });

        // 2. วาดข้อความ "ศศิ" สลับ "รักเธอ" บนรูปหัวใจหลัก
        heartParticles.forEach((p, idx) => {
            if (idx < progress) {
                if (p.alpha < 1) p.alpha += 0.08;

                const currentScale = scale * pulseFactor;
                const x = centerX + p.baseX * currentScale;
                const y = centerY + p.baseY * currentScale;

                ctx.font = `bold ${p.size}px Tahoma, sans-serif`;
                
                // แสงเรืองแสงสีชมพูวิ้ง
                ctx.shadowBlur = 15;
                ctx.shadowColor = `rgba(255, 20, 147, ${p.alpha})`; // Pink Glow
                ctx.fillStyle = `rgba(255, 182, 193, ${p.alpha})`;  // Light Pink Text
                
                ctx.fillText(p.text, x, y);
            }
        });

        requestAnimationFrame(draw);
    }

    draw();
</script>

</body>
</html>
