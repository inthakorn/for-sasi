<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sasi ❤️</title>
    <style>
        body {
            margin: 0;
            background-color: #05050d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Tahoma', 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // สมการรูปหัวใจ
    function heartEquation(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x, y };
    }

    const text = "ศศิ";
    const particles = [];
    const particleCount = 180; // จำนวนคำว่า ศศิ

    for (let i = 0; i < particleCount; i++) {
        const t = (Math.PI * 2 / particleCount) * i;
        const pos = heartEquation(t);
        
        particles.push({
            baseX: pos.x,
            baseY: pos.y,
            size: Math.random() * 4 + 14, // ขนาดตัวอักษร
            angle: t,
            speed: Math.random() * 0.02 + 0.01,
            offset: Math.random() * Math.PI * 2
        });
    }

    let pulse = 0;

    function draw() {
        // เคลียร์หน้าจอแบบมีเงาจางๆ ให้เกิด Effect เรืองแสง
        ctx.fillStyle = 'rgba(5, 5, 13, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        // มาตราส่วนปรับตามขนาดหน้าจอ
        const scale = Math.min(canvas.width, canvas.height) / 40;
        
        pulse += 0.03;
        const pulseFactor = 1 + Math.sin(pulse) * 0.05; // เอฟเฟกต์หัวใจเต้น

        particles.forEach(p => {
            const currentScale = scale * pulseFactor;
            const x = centerX + p.baseX * currentScale;
            const y = centerY + p.baseY * currentScale;

            ctx.font = `bold ${p.size}px Tahoma, sans-serif`;
            
            // แสงเรืองแสงสีฟ้า/ชมพู
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#80e5ff';
            
            ctx.fillText(text, x, y);
        });

        requestAnimationFrame(draw);
    }

    draw();
</script>

</body>
</html>
