<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sasi 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Tahoma', 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }
        #startButton {
            padding: 16px 36px;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.7);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #startButton:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 20, 147, 1);
        }
    </style>
</head>
<body>

<div id="startOverlay">
    <button id="startButton">แตะเพื่อเปิด ❤️</button>
</div>

<!-- ลองใช้ลิงก์ไฟล์ MP3 สำรองขนาดเล็กเพื่อทดสอบระบบเสียง -->
<audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
</audio>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('startOverlay');
    const startButton = document.getElementById('startButton');
    const bgMusic = document.getElementById('bgMusic');

    let isStarted = false;

    startButton.addEventListener('click', () => {
        bgMusic.play().then(() => {
            console.log("Playing");
        }).catch(e => {
            console.log("Error:", e);
        });
        
        startOverlay.style.opacity = '0';
        setTimeout(() => {
            startOverlay.style.display = 'none';
            isStarted = true;
        }, 800);
    });

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function heartEquation(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x, y };
    }

    const textList = ["ศศิ", "รักเธอ"];
    const heartParticles = [];
    const totalHeartPoints = 90;

    for (let i = 0; i < totalHeartPoints; i++) {
        const t = (Math.PI * 2 / totalHeartPoints) * i - Math.PI / 2;
        const pos = heartEquation(t);
        
        heartParticles.push({
            baseX: pos.x,
            baseY: pos.y,
            text: textList[i % textList.length],
            size: 20,
            alpha: 0
        });
    }

    const sparkleCount = 120;
    const sparkles = [];
    for (let i = 0; i < sparkleCount; i++) {
        const t = Math.random() * Math.PI * 2;
        const pos = heartEquation(t);
        const distanceOffset = (Math.random() - 0.5) * 12;
        
        sparkles.push({
            baseX: pos.x + distanceOffset,
            baseY: pos.y + distanceOffset,
            text: textList[i % textList.length],
            size: Math.random() * 5 + 9,
            alpha: Math.random(),
            speed: Math.random() * 0.02 + 0.008
        });
    }

    let progress = 0;
    let pulse = 0;

    function draw() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (isStarted) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) / 42;

            pulse += 0.035;
            const pulseFactor = 1 + Math.sin(pulse) * 0.03;

            if (progress < totalHeartPoints) {
                progress += 0.15; // ค่อยๆ วนขึ้นรูปหัวใจอย่างช้าๆ นุ่มนวล
            }

            sparkles.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;

                const x = centerX + s.baseX * scale * pulseFactor;
                const y = centerY + s.baseY * scale * pulseFactor;

                ctx.font = `bold ${s.size}px Tahoma, sans-serif`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff2a8d';
                ctx.fillStyle = `rgba(255, 105, 180, ${Math.max(0, s.alpha * 0.85)})`;
                ctx.fillText(s.text, x, y);
            });

            heartParticles.forEach((p, idx) => {
                if (idx < progress) {
                    if (p.alpha < 1) p.alpha += 0.03;

                    const currentScale = scale * pulseFactor;
                    const x = centerX + p.baseX * currentScale;
                    const y = centerY + p.baseY * currentScale;

                    ctx.font = `bold ${p.size}px Tahoma, sans-serif`;
                    
                    ctx.shadowBlur = 16;
                    ctx.shadowColor = `rgba(255, 20, 147, ${p.alpha})`;
                    ctx.fillStyle = `rgba(255, 192, 203, ${p.alpha})`;
                    
                    ctx.fillText(p.text, x, y);
                }
            });
        }

        requestAnimationFrame(draw);
    }

    draw();
</script>

</body>
</html>
